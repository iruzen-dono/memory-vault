[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "hermes-memory-vault"
version = "0.2.0"
description = "Portable Context Protocol — package AI agent sessions into portable .hermes-memory packs"
readme = "README.md"
authors = [
    { name = "Jules Zhou", email = "juleszhou01@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["hermes", "ai-agent", "memory", "portable", "open-source"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    "mypy>=1.0,<2.0",
    "ruff>=0.1,<1.0",
]
vault = [
    "markdown>=3.5,<4.0",
]
tui = [
    "textual>=2.0,<3.0",
]
all = ["memory-vault[vault,tui]"]

[project.urls]
Homepage = "https://github.com/iruzen-dono/memory-vault"
Repository = "https://github.com/iruzen-dono/memory-vault"
Issues = "https://github.com/iruzen-dono/memory-vault/issues"
Documentation = "https://github.com/iruzen-dono/memory-vault/blob/master/docs/ARCHITECTURE.md"
Changelog = "https://github.com/iruzen-dono/memory-vault/blob/master/CHANGELOG.md"

[project.scripts]
memory-vault = "memory_vault.cli.main:app"
memory-vault-webhook = "memory_vault.webhook:serve"

[tool.ruff]
line-length = 250
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
