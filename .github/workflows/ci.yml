name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Type-check (mypy)
        run: uv run mypy src/

      - name: Test (pytest)
        run: uv run pytest tests/ -v

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: uv build

      - name: Validate metadata
        run: uvx twine check dist/*

      - name: Install the wheel in a clean venv and smoke-test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          # The CLI exposes --help; verify the command tree renders.
          # (no --version in the smoke test: the typer flag takes a value)
          /tmp/clean/bin/memory-vault --help > /dev/null
          # The webhook entry point starts a blocking HTTP server, so it has no
          # --help. Import the module instead of invoking the command.
          /tmp/clean/bin/python -c "import memory_vault.webhook; assert callable(memory_vault.webhook.serve)"
